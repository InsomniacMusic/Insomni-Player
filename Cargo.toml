[package]
name = "insomniac_player"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.27"
egui = "0.27"
rodio = { version = "0.22.2", features = ["symphonia-all"] }
rfd = "0.14"
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
walkdir = "2"
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(windows)'.dependencies]
rodio = { version = "0.22.2", features = ["symphonia-all"] }
